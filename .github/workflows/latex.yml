name: Compile LaTeX

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          compiler: pdflatex
          args: -interaction=nonstopmode -file-line-error

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Unit-IV-Presentation
          path: main.pdf
